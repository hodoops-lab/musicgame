<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>rest test</title>
<style>
body{background:#14102b; padding:20px;}
.box{display:inline-block; background:#1c1740; margin:6px; padding:6px; border:1px solid #352b6e;}
svg{overflow:visible;}
</style>
</head>
<body>

<div class="box"><svg viewBox="0 0 44 92" width="88" height="184">
<!-- Candidate A: filled zigzag flag shape, single hook (8th rest) -->
<path d="M 26,20 C 32,22 33,28 28,30 C 24,32 25,36 29,38 L 18,68 L 14,66 L 24,38 C 20,36 19,31 23,29 C 26,27.5 27,24 22,22 Z" fill="#9b93c9"/>
</svg><div style="color:#fff;text-align:center;font:12px sans-serif">A: 8th (1 hook, filled zigzag)</div></div>

<div class="box"><svg viewBox="0 0 44 92" width="88" height="184">
<!-- Candidate A2: two hooks (16th rest) -->
<path d="M 28,10 C 34,12 35,18 30,20 C 26,22 27,26 31,28 L 20,58 L 16,56 L 26,28 C 22,26 21,21 25,19 C 28,17.5 29,14 24,12 Z
M 24,28 C 30,30 31,36 26,38 C 22,40 23,44 27,46 L 20,58 L 16,56 " fill="#9b93c9"/>
</svg><div style="color:#fff;text-align:center;font:12px sans-serif">A2: 16th (2 hooks) v1</div></div>

<div class="box"><svg viewBox="0 0 44 92" width="88" height="184">
<!-- Candidate B: simple stroke-based diagonal + oval flags -->
<path d="M25,20 L15,70" stroke="#9b93c9" stroke-width="3.2" stroke-linecap="round" fill="none"/>
<ellipse cx="26" cy="26" rx="6" ry="4.5" fill="#9b93c9" transform="rotate(55 26 26)"/>
</svg><div style="color:#fff;text-align:center;font:12px sans-serif">B: 8th (stem+oval)</div></div>

<div class="box"><svg viewBox="0 0 44 92" width="88" height="184">
<path d="M27,12 L15,70" stroke="#9b93c9" stroke-width="3.2" stroke-linecap="round" fill="none"/>
<ellipse cx="28" cy="18" rx="6" ry="4.5" fill="#9b93c9" transform="rotate(55 28 18)"/>
<ellipse cx="23" cy="34" rx="6" ry="4.5" fill="#9b93c9" transform="rotate(55 23 34)"/>
</svg><div style="color:#fff;text-align:center;font:12px sans-serif">B2: 16th (stem+2 oval)</div></div>

<div class="box"><svg viewBox="0 0 44 92" width="88" height="184">
<!-- Candidate C: classic "slashed rest" using two crossing strokes + box like real 8th rest silhouette -->
<circle cx="27" cy="24" r="5" fill="#9b93c9"/>
<path d="M27,24 L14,68" stroke="#9b93c9" stroke-width="3.4" stroke-linecap="round" fill="none"/>
<path d="M27,24 C22,26 20,32 24,36" stroke="#9b93c9" stroke-width="3.4" stroke-linecap="round" fill="none"/>
</svg><div style="color:#fff;text-align:center;font:12px sans-serif">C: 8th (blob+curl)</div></div>

<div class="box"><svg viewBox="0 0 44 92" width="88" height="184">
<!-- Candidate D: real-ish eighth rest silhouette approximation (SMuFL-inspired) -->
<path d="M24,16
  c5,1 7,6 3,9
  c-3,2 -3,5 0,7
  l-11,34
  l-4,-1
  l10,-33
  c-3,-2 -3,-5 0,-7
  c2,-1 2,-3 -1,-4
  c-2,-1 -3,-3 -1,-4 z" fill="#9b93c9"/>
</svg><div style="color:#fff;text-align:center;font:12px sans-serif">D: 8th (curled flag v2)</div></div>

<div class="box"><svg viewBox="0 0 44 92" width="88" height="184">
<path d="M28,10
  c5,1 7,6 3,9
  c-3,2 -3,5 0,7
  l-2,6
  c5,1 7,6 3,9
  c-3,2 -3,5 0,7
  l-11,26
  l-4,-1
  l10,-25
  c-3,-2 -3,-5 0,-7
  l2,-6
  c-3,-2 -3,-5 0,-7
  c2,-1 2,-3 -1,-4
  c-2,-1 -3,-3 -1,-4 z" fill="#9b93c9"/>
</svg><div style="color:#fff;text-align:center;font:12px sans-serif">D2: 16th (double curled flag)</div></div>

</body></html>
